 max="1800" required>
<label>Số chim con</label><input name="count" type="number" min="1" required>
<label>Đánh giá</label>
<select name="quality"><option value="good">Nuôi tốt</option><option value="poor">Nuôi kém</option></select>
<label>Ghi chú</label><textarea name="note"></textarea>
<button class="save" id="chickSubmit">Lưu giao nuôi</button>
<button class="cancel hidden" id="chickCancel" type="button" onclick="cancelEdit('chicks')">Hủy sửa</button>
</form>
</div>
<div class="card"><h3>Lịch sử nuôi con</h3><div id="chickList"></div></div>
</section>

<section id="moves">
<div class="card">
<h3>Ghi nhận chuyển tổ</h3>
<form id="moveForm" onsubmit="saveForm(event,'moves')">
<label>Ngày chuyển</label><input name="date" type="date" required>
<label>Tổ cũ</label><input name="from" type="number" min="1" max="1800" required>
<label>Tổ mới</label><input name="to" type="number" min="1" max="1800" required>
<label>Số chim</label><input name="count" type="number" min="1" required>
<label>Ghi chú</label><textarea name="note"></textarea>
<button class="save" id="moveSubmit">Lưu chuyển tổ</button>
<button class="cancel hidden" id="moveCancel" type="button" onclick="cancelEdit('moves')">Hủy sửa</button>
</form>
</div>
<div class="card"><h3>Lịch sử chuyển tổ</h3><div id="moveList"></div></div>
</section>

<section id="stats">
<div class="card">
<h3>Thống kê</h3>
<label>Ngày xem</label><input type="date" id="statDate" onchange="render()">
<div id="statBox" class="stat"></div>
</div>
<div class="card"><h3>Thống kê trứng theo tổ</h3><div id="eggStats"></div></div>
<div class="card"><h3>Đánh giá tổ nuôi con</h3><div id="qualityStats"></div></div>
<div class="card"><h3>Thống kê bỏ ấp</h3><div id="dropStats"></div></div>
</section>

<p class="muted">Dữ liệu đồng bộ qua Firebase tại appThaoV1. Không ghi đè dữ liệu cũ complete.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyAE7M7khd-exDyS9FFIhJOiqTQxtB9inxI",
authDomain:"trai-chim-cua-toi.firebaseapp.com",
projectId:"trai-chim-cua-toi",
storageBucket:"trai-chim-cua-toi.firebasestorage.app",
messagingSenderId:"221656058023",
appId:"1:221656058023:web:c44894b5a709f6a9863382",
measurementId:"G-7ZFZM6M7XC"
};

const DOC="users/1ePS2ZPFVpVyErE3L81CzJT6kPb2/farmData/appThaoV1";
const KEY="thaoBirdFarmDemoV1";
const TYPES=["eggs","nests","pairs","chicks","moves"];
let db={eggs:[],nests:[],pairs:[],chicks:[],moves:[],drops:[],photoUsage:{}};
let editing={},cloud=null,ref=null,ready=false,busy=false,eggPhotoURL=null;

const $=id=>document.getElementById(id);

function today(){
let d=new Date();
return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function fmt(d){return d?d.split("-").reverse().join("/"):""}
function nestFmt(n){n=Number(n);return n<1000?String(n).padStart(3,"0"):String(n)}
function safe(s){
return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function datePlus(d,n){
let x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);
return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function setStatus(s){$("status").textContent=s}

function tab(id,btn){
document.querySelectorAll("main section").forEach(x=>x.classList.remove("active"));
document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
$(id).classList.add("active");btn.classList.add("active");
}

function getForm(t){
return $(t==="eggs"?"eggForm":t==="nests"?"nestForm":t==="pairs"?"pairForm":t==="chicks"?"chickForm":"moveForm");
}
function fields(f){
let o={};new FormData(f).forEach((v,k)=>o[k]=v);return o;
}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

async function persist(){
localSave();
if(!ref||!ready)return;
if(busy){setStatus("Đang lưu, vui lòng chờ");return}
busy=true;
try{
await ref.set({...db,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
setStatus("Đã đồng bộ dữ liệu");
}catch(e){setStatus("Lỗi đồng bộ: "+e.message);console.error(e)}
finally{busy=false}
}

function saveForm(ev,type){
ev.preventDefault();
let f=getForm(type),d=fields(f),idx=editing[type];
if(d.nest!==undefined){
if(!Number.isInteger(Number(d.nest))||Number(d.nest)<1||Number(d.nest)>1800){
alert("Mã tổ phải từ 1 đến 1800");return;
}
d.nest=Number(d.nest);
}
if(d.count!==undefined)d.count=Number(d.count);
if(type==="moves"){
d.from=Number(d.from);d.to=Number(d.to);d.count=Number(d.count);
if(d.from===d.to){alert("Tổ cũ và tổ mới không được giống nhau");return}
}
if(type==="nests"){
let duplicate=db.nests.some((x,i)=>x.active!==false&&Number(x.nest)===d.nest&&i!==idx);
if(duplicate){alert("Tổ này đang trong danh sách ấp");return}
d.active=true;
}
d.id=idx!==undefined&&idx!==null?db[type][idx].id:newId();
if(idx!==undefined&&idx!==null)db[type][idx]=d;
else db[type].unshift(d);
delete editing[type];
f.reset();
let date=f.elements.namedItem("date");if(date)date.value=today();
persist();render();updateButtons(type);
}

function updateButtons(t){
let p=t==="eggs"?"egg":t==="nests"?"nest":t==="pairs"?"pair":t==="chicks"?"chick":"move";
$(p+"Submit").textContent=t==="eggs"?"Lưu trứng":t==="nests"?"Thêm tổ ấp":"Lưu thông tin";
$(p+"Cancel").classList.add("hidden");
}
function cancelEdit(t){
editing[t]=null;let f=getForm(t);f.reset();
let d=f.elements.namedItem("date");if(d)d.value=today();
updateButtons(t);
}
function edit(t,id){
let idx=db[t].findIndex(x=>x.id===id);if(idx<0)return;
editing[t]=idx;let f=getForm(t);f.reset();
Object.entries(db[t][idx]).forEach(([k,v])=>{
let el=f.elements.namedItem(k);if(el)el.value=v??"";
});
let p=t==="eggs"?"egg":t==="nests"?"nest":t==="pairs"?"pair":t==="chicks"?"chick":"move";
$(p+"Submit").textContent="Cập nhật";
$(p+"Cancel").classList.remove("hidden");
f.scrollIntoView({behavior:"smooth"});
}
async function remove(t,id){
if(!confirm("Xóa bản ghi này?"))return;
db[t]=db[t].filter(x=>x.id!==id);await persist();render();
}
function buttons(t,id){
return `<div class="actions"><button class="edit" onclick="edit('${t}','${id}')">Sửa</button><button class="del" onclick="remove('${t}','${id}')">Xóa</button></div>`;
}
function item(title,lines,t,r){
return `<div class="item"><b>${title}</b>${lines.map(x=>`<p>${x}</p>`).join("")}${buttons(t,r.id)}</div>`;
}

function render(){
$("eggList").innerHTML=db.eggs.length?db.eggs.map(r=>item("Trứng tổ "+nestFmt(r.nest),["Ngày: "+fmt(r.date),"Số quả: "+r.count,"Ghi chú: "+safe(r.note)],"eggs",r)).join(""):"<p>Chưa có dữ liệu trứng.</p>";

$("nestList").innerHTML=db.nests.length?db.nests.map(r=>{
let status=r.active===false?"Đã kết thúc":"Đang ấp";
return item("Tổ "+nestFmt(r.nest),["Ngày vào ấp: "+fmt(r.date),"Trạng thái: "+status,"Ưu tiên: "+(r.priority==="yes"&&r.quality!=="poor"?"Có":"Không"),"Đánh giá: "+(r.quality==="poor"?"Nuôi con kém":"Nuôi con tốt"),"Ghi chú: "+safe(r.note)],"nests",r)+(r.active===false?"":`<button class="cancel" onclick="dropNest('${r.id}')">Bỏ ấp</button>`);
}).join(""):"<p>Chưa có tổ ấp.</p>";

$("pairList").innerHTML=db.pairs.length?db.pairs.map(r=>item("Ghép đôi tổ "+nestFmt(r.nest),["Ngày ghép: "+fmt(r.date),"Trống: "+safe(r.male),"Mái: "+safe(r.female),"Ghi chú: "+safe(r.note)],"pairs",r)).join(""):"<p>Chưa có dữ liệu ghép đôi.</p>";

$("saleList").innerHTML=db.pairs.map(r=>`<div class="item"><b>Tổ ${nestFmt(r.nest)}</b><p>Ngày ghép: ${fmt(r.date)}</p><p>Dự kiến bán: ${fmt(datePlus(r.date,25))} đến ${fmt(datePlus(r.date,30))}</p></div>`).join("")||"Chưa có lịch bán.";

$("chickList").innerHTML=db.chicks.length?db.chicks.map(r=>item("Nuôi con tổ "+nestFmt(r.nest),["Ngày: "+fmt(r.date),"Số chim: "+r.count,"Đánh giá: "+(r.quality==="poor"?"Nuôi kém":"Nuôi tốt"),"Ghi chú: "+safe(r.note)],"chicks",r)).join(""):"<p>Chưa có dữ liệu.</p>";

$("moveList").innerHTML=db.moves.length?db.moves.map(r=>item("Chuyển tổ",["Ngày: "+fmt(r.date),"Từ tổ "+nestFmt(r.from)+" sang tổ "+nestFmt(r.to),"Số chim: "+r.count,"Ghi chú: "+safe(r.note)],"moves",r)).join(""):"<p>Chưa có dữ liệu.</p>";

let date=$("statDate").value||today();
let eggs=db.eggs.filter(x=>x.date===date).reduce((s,x)=>s+Number(x.count||1),0);
let nestCount=db.nests.filter(x=>x.active!==false).length;
let pairs=db.pairs.filter(x=>x.date===date).length;
$("statBox").innerHTML=`<div>Trứng trong ngày<b>${eggs}</b></div><div>Tổ đang ấp<b>${nestCount}</b></div><div>Ghép đôi trong ngày<b>${pairs}</b></div><div>Lượt giao nuôi<b>${db.chicks.length}</b></div>`;

let groups={};db.eggs.forEach(x=>groups[x.nest]=(groups[x.nest]||0)+Number(x.count||1));
$("eggStats").innerHTML=Object.keys(groups).sort((a,b)=>a-b).map(k=>`<p>Tổ ${nestFmt(k)}: <b>${groups[k]} quả</b></p>`).join("")||"Chưa có dữ liệu.";

let q={};db.chicks.forEach(x=>{q[x.nest]??={good:0,poor:0};q[x.nest][x.quality==="poor"?"poor":"good"]++});
$("qualityStats").innerHTML=Object.entries(q).map(([k,v])=>`<p>Tổ ${nestFmt(k)}: nuôi tốt ${v.good} lần, nuôi kém ${v.poor} lần</p>`).join("")||"Chưa có dữ liệu.";
$("dropStats").innerHTML=`Đã bỏ ấp: <b>${db.drops.length}</b> lần`;
updatePhotoLabel();
}

async function dropNest(id){
let r=db.nests.find(x=>x.id===id);if(!r)return;
let reason=prompt("Lý do bỏ ấp (có thể để trống):","");
if(reason===null)return;
r.active=false;r.endDate=today();
db.drops.unshift({id:newId(),nest:r.nest,date:today(),reason});
await persist();render();
}

function photoDay(){return today()}
function updatePhotoLabel(){
if($("photoCount"))$("photoCount").textContent="Đã xác nhận "+Number((db.photoUsage||{})[photoDay()]||0)+"/5 ảnh hôm nay.";
}
function previewEggPhoto(){
let file=$("eggPhoto").files[0];if(!file)return;
if(eggPhotoURL)URL.revokeObjectURL(eggPhotoURL);
eggPhotoURL=URL.createObjectURL(file);
$("eggPreview").src=eggPhotoURL;
$("eggPreview").style.display="block";
$("ocrStatus").textContent="Đã chọn ảnh. Nhấn nút nhận diện để thử đọc số.";
$("ocrResults").textContent="";
}

async function runEggOCR(){
let file=$("eggPhoto").files[0];
if(!file){alert("Hãy chụp hoặc chọn ảnh trước.");return}
if(!window.Tesseract){alert("Không tải được thư viện OCR. Kiểm tra mạng rồi tải lại trang.");return}
let status=$("ocrStatus"),out=$("ocrResults");
status.textContent="Đang khởi động nhận diện...";out.textContent="";
let worker=null;
try{
worker=await Tesseract.createWorker("eng",1,{logger:m=>{
if(m.status==="recognizing text")status.textContent="Đang nhận diện: "+Math.round((m.progress||0)*100)+"%";
}});
await worker.setParameters({tessedit_char_whitelist:"0123456789",tessedit_pageseg_mode:"11"});
let result=await worker.recognize(file),words=result.data.words||[],hits=[];
words.forEach(w=>{
let s=(w.text||"").replace(/[^0-9]/g,"");if(!s)return;
let n=parseInt(s,10);if(n>=1&&n<=1800)hits.push({n,confidence:Math.round(w.confidence||0),x:w.bbox?.x0||0,y:w.bbox?.y0||0});
});
hits.sort((a,b)=>Math.abs(a.y-b.y)>18?a.y-b.y:a.x-b.x);
if(!hits.length)out.textContent="Không tìm thấy số tổ đủ rõ. Hãy thử chụp gần hơn hoặc nhập thủ công.";
else out.textContent="CÁC SỐ OCR ĐỌC ĐƯỢC (CHƯA XÁC NHẬN):\n"+hits.map((h,i)=>(i+1)+". Tổ "+h.n+" — tin cậy "+h.confidence+"%").join("\n")+"\n\nCác số này chưa được xác minh là mã của từng quả trứng.";
status.textContent="Đã phân tích xong. Hãy đối chiếu với ảnh; chưa có số nào được tự động lưu.";
}catch(e){
console.error(e);status.textContent="Nhận diện thất bại.";
alert("Không nhận diện được ảnh lần này. Hãy thử ảnh rõ hơn hoặc tải lại trang.");
}finally{if(worker)await worker.terminate()}
}

async function countPhoto(){
let file=$("eggPhoto").files[0];
if(!file){alert("Hãy chọn hoặc chụp ảnh trước.");return}
if(!ref||!ready){alert("Chưa kết nối máy chủ.");return}
try{
await cloud.runTransaction(async tx=>{
let snap=await tx.get(ref),data=snap.exists?snap.data():{},usage=data.photoUsage||{},day=photoDay(),n=Number(usage[day]||0);
if(n>=5)throw new Error("Đã hết 5 lượt ảnh hôm nay.");
usage[day]=n+1;
tx.set(ref,{photoUsage:usage,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
});
let snap=await ref.get();
if(snap.exists)db.photoUsage=snap.data().photoUsage||{};
localSave();updatePhotoLabel();
$("eggPhoto").value="";$("eggPreview").style.display="none";
$("ocrResults").textContent="";$("ocrStatus").textContent="Đã ghi nhận lượt ảnh.";
if(eggPhotoURL){URL.revokeObjectURL(eggPhotoURL);eggPhotoURL=null}
alert("Đã ghi nhận lượt ảnh. Kết quả OCR chưa tự lưu thành dữ liệu trứng; hãy kiểm tra và nhập số tổ chính xác.");
}catch(e){alert(e.message)}
}

async function startCloud(){
try{
firebase.initializeApp(firebaseConfig);
cloud=firebase.firestore();
await firebase.auth().signInAnonymously();
ref=cloud.doc(DOC);
let snap=await ref.get();
if(snap.exists){
let x=snap.data();
TYPES.forEach(k=>{if(Array.isArray(x[k]))db[k]=x[k]});
db.drops=Array.isArray(x.drops)?x.drops:[];
db.photoUsage=x.photoUsage||{};
}else{
await ref.set({...db,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
}
ready=true;localSave();
setStatus("Đã kết nối và đồng bộ");
ref.onSnapshot(s=>{
if(!s.exists||busy)return;
let x=s.data();
TYPES.forEach(k=>{if(Array.isArray(x[k]))db[k]=x[k]});
db.drops=Array.isArray(x.drops)?x.drops:[];
db.photoUsage=x.photoUsage||{};
localSave();render();
},e=>setStatus("Lỗi nhận dữ liệu: "+e.message));
render();
}catch(e){
setStatus("Chưa kết nối máy chủ - đang dùng dữ liệu trên máy");
console.error(e);
}
}

TYPES.forEach(t=>{
let f=getForm(t),d=f.elements.namedItem("date");
if(d)d.value=today();
});
$("statDate").value=today();
render();
startCloud();
</script>
